x-database-environment: &database-environment
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

x-application-environment: &application-environment
  <<: *database-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SQL_ECHO: ${SQL_ECHO:-false}

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ragxiv-postgres
    environment:
      <<: *database-environment
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: ragxiv-app:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *application-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ragxiv-app:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *application-environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
