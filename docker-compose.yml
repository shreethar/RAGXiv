services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ragxiv-postgres
    environment:
      POSTGRES_USER: ragxiv
      POSTGRES_PASSWORD: ragxiv_password
      POSTGRES_DB: ragxiv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
